name: Release

on:
  push:
    branches:
      - main

env:
  GITHUB_REGISTRY: ghcr.io
  GOOGLE_REGISTRY: europe-west2-docker.pkg.dev
  GOOGLE_REGISTRY_NAME: devops
  GITHUB_REGISTRY_USERNAME: ${{ github.actor }}
  GITHUB_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  IMAGE_NAME: devops-project-sdu/frontend

jobs:
  version-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: bump tag
        id: bump-tag
        uses: anothrNick/github-tag-action@1.36.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: false

    outputs:
      tag: ${{ steps.bump-tag.outputs.tag }}

  release:
    needs: version-and-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Run build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITHUB_REGISTRY }}
          username: ${{ env.GITHUB_REGISTRY_USERNAME }}
          password: ${{ env.GITHUB_REGISTRY_PASSWORD }}

      - name: Build docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: VERSION=v${{ needs.version-and-tag.outputs.tag }}
          tags: ${{ needs.version-and-tag.outputs.tag }}

      - name: Run trivy scan
        uses: Devops-project-SDU/.github/actions/trivy-scan@main
        with:
          image-tag: ${{ needs.version-and-tag.outputs.tag }}

      - name: Push Docker image to GCR
        uses: RafikFarhad/push-to-gcr-github-action@v5-rc1
        with:
          context: .
          gcloud_service_key: ${{ secrets.GKE_GSA_GCR_ACCESSOR }}
          registry: ${{ env.GOOGLE_REGISTRY }}
          project_id: devops-422910
          image_name: ${{ env.GOOGLE_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}
          image_tag: ${{ needs.version-and-tag.outputs.tag }}, latest

      - name: install the gcloud cli
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: devops-422910
          service_account_key: ${{ secrets.GKE_GSA_DEVELOPER }}
          install_components: "gke-gcloud-auth-plugin"
          export_default_credentials: true

      - name: Deploy to gke
        run: |
          gcloud container clusters get-credentials devops --region=europe-west2
          kubectl set image deployment/frontend frontend=${{ env.GOOGLE_REGISTRY }}/devops-422910/${{ env.IMAGE_NAME }}:${{ needs.version-and-tag }} -n frontend

      - name: Push docker image to GHCR
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64,linux/ppc64le,linux/arm64
          push: true
          tags: |
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version-and-tag.outputs.tag }}
            ${{ env.GITHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
